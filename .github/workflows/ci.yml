name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    # Line tables keep backtraces readable at a fraction of full debug info's size: full debug builds of wgpu
    # filled the runner's disk.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - name: Make room for the debug builds
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check licenses }
      # Dependencies (LibRaw included) come from the cache; only Sidecar's own crates rebuild per push.
      - uses: Swatinem/rust-cache@v2
      # LibRaw builds against zlib and libjpeg; exiftool is shelled out to when copying export metadata.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libjpeg-dev zlib1g-dev pkg-config libimage-exiftool-perl
      - run: cargo clippy --workspace --exclude sidecar-ml --all-targets -- -D warnings
      # GPU tests fall back to lavapipe (software Vulkan) on CI runners.
      - run: cargo test --workspace --exclude sidecar-ml
  # sidecar-ml on its own runner: burn's debug build is what filled the disk (the linker died with a bus error
  # writing its test binary), and nothing else depends on it.
  ml:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - name: Make room for burn's debug build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: cargo clippy -p sidecar-ml --all-targets -- -D warnings
      - run: cargo test -p sidecar-ml
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # LibRaw builds against zlib and libjpeg; exiftool is shelled out to when copying export metadata.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libjpeg-dev zlib1g-dev pkg-config libimage-exiftool-perl
      # The web app imports generated files that are not in git: the composed WGSL and the colour maths as wasm.
      - run: cargo run -p sidecar-shaders -- web/src/lib/gpu/wgsl
      - run: cargo build --release -p sidecar-color-wasm --target wasm32-unknown-unknown
      - run: cp target/wasm32-unknown-unknown/release/sidecar_color_wasm.wasm web/src/lib/color/sidecar_color.wasm
      - run: cargo run -p sidecar-devtools -- parity fixtures web/static/parity
      - run: cargo run -p sidecar-devtools -- parity native web/static/parity testdata/parity-out
      - working-directory: web
        run: npm ci && npx playwright install --with-deps chromium && npm run build && node scripts/parity-browser.mjs ../testdata/parity-out --swiftshader
      - run: cargo run -p sidecar-devtools -- parity compare web/static/parity testdata/parity-out

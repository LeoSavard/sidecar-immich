name: image
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: dtolnay/rust-toolchain@stable
      - name: Third-party notices
        run: |
          cargo install --locked cargo-about
          cargo about generate about.hbs >> THIRD_PARTY_NOTICES.md
      # GHCR rejects uppercase names, and the owner here is mixed case. `latest` follows real releases only:
      # a tag containing a hyphen (v0.2.0-rc1) is a prerelease and must not move it.
      - id: tags
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$repo:${GITHUB_REF_NAME}"
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags="$tags,$repo:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          sbom: true
          provenance: mode=max

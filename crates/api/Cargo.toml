[package]
name = "sidecar-api"
description = "Sidecar api: HTTP, identity resolution, XMP sidecars, jobs, SSE, Immich client, the web app"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
futures-util.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
hex.workspace = true
sidecar-color.workspace = true
sidecar-template.workspace = true
sidecar-xmp.workspace = true
anyhow.workspace = true
axum.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# LittleCMS (MIT), for soft proofing: the reference CMS, with intents, black point compensation and a gamut check.
lcms2 = "6"
# Its vendored C sources, always: a system liblcms2 found by pkg-config would be a library the runtime image lacks.
lcms2-sys = { version = "4", features = ["static"] }
tokio.workspace = true
toml.workspace = true
thiserror.workspace = true
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"

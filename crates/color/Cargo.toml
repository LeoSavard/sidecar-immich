[package]
name = "sidecar-color"
description = "White balance, camera matrices, tone curve LUTs and develop-uniform packing (native and wasm32)"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# TypeScript for the web app's copies of the edit types (`--features ts`, run by `cargo test`); off by default.
ts-rs = { version = "12", optional = true, default-features = false, features = ["serde-compat"] }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
naga.workspace = true
sidecar-shaders.workspace = true

[package]
name = "sidecar-uniform-derive"
description = "#[derive(Uniform)]: a uniform struct's WGSL declaration, written from its Rust definition"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

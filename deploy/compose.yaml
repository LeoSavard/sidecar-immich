# Example deployment. Put HTTPS in front of port 8080 (your reverse proxy, a Cloudflare Tunnel, or `tailscale serve`).

# Pinned, because the default is the directory's name and the named volumes below are prefixed with it:
# renaming or moving this directory would otherwise start a second stack on empty volumes rather than the
# one holding your sessions and cached proxies.
name: sidecar
services:
  sidecar-api:
    image: ghcr.io/leosavard/sidecar-immich:latest
    command: ["api", "--config", "/etc/sidecar.toml"]
    # Literally the owner of your photo files: Sidecar saves an edit as an XMP beside the original, so this
    # account needs write access to the folders below. Immich writes its own internal library as root:root by
    # default, which this user can read and not write — see docs/INSTALL.md.
    user: "1000:1000"
    volumes:
      - ./sidecar.toml:/etc/sidecar.toml:ro
      - ./immich-admin-key:/run/secrets/immich_admin_key:ro   # optional, job.create only
      - /path/to/photos:/photos:rw                      # sidecar writer only creates *.xmp files
      - sidecar-cache:/cache:ro
      - sidecar-state:/state
    ports: ["8080:8080"]
    networks: [immich, sidecar]
    restart: unless-stopped

  sidecar-worker:
    # `latest-ml` adds the machine-learning models (about 4 GB of GPU memory while they run); docs/INSTALL.md.
    # Keep api and worker on the same version.
    image: ghcr.io/leosavard/sidecar-immich:latest
    command: ["worker", "--listen", "0.0.0.0:8081", "--cache", "/cache"]
    read_only: true
    cap_drop: [ALL]
    volumes:
      - /path/to/photos:/photos:ro
      - sidecar-cache:/cache
    tmpfs: [/tmp]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    networks: [sidecar]
    restart: unless-stopped

volumes:
  sidecar-cache: {}
  sidecar-state: {}

networks:
  immich: { external: true, name: immich_default }
  sidecar: { internal: true }

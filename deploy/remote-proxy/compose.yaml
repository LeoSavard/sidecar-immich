# Worked example: Immich in Docker (network immich_default), photo libraries on the host, HTTPS through a
# reverse proxy on another machine that reaches this one directly (over a VPN, say). To use it, copy this
# directory to deploy/local/ (git-ignored) and edit it for your machine.
#
# If the library is mostly HEIC and JPEG, build the image with a HEIF decoder:
#   docker build --build-arg HEIF=1 -t sidecar:local .
# Without it everything still works except HEIC, which reports what's missing. See the Dockerfile for why
# that decoder isn't in the published image.

# Pinned, because the default is the directory's name and the named volumes below are prefixed with it:
# renaming or moving this directory would otherwise start a second stack on empty `sidecar-state` and
# `sidecar-cache` volumes -- every session signed out, Recent empty, every proxy decoded again -- while the
# old one kept the port.
name: sidecar
services:
  sidecar-api:
    image: sidecar:local
    command: ["api", "--config", "/etc/sidecar.toml"]
    user: "1000:1000"
    volumes:
      - ./sidecar.toml:/etc/sidecar.toml:ro
      - ${HOME}/.config/sidecar/immich-admin-key:/run/secrets/immich_admin_key:ro
      - /mnt/storage/Photography:/mnt/storage/Photography:rw
      - /mnt/storage/immich_library:/data:rw
      - sidecar-cache:/cache:ro
      - sidecar-state:/state
    ports: ["8090:8080"]                                 # reachable from the proxy host, not just loopback
    security_opt: ["label=disable"]
    networks: [immich, sidecar]
    restart: unless-stopped

  sidecar-worker:
    image: sidecar:local
    command: ["worker", "--listen", "0.0.0.0:8081", "--cache", "/cache"]
    read_only: true
    cap_drop: [ALL]
    volumes:
      - /mnt/storage/Photography:/mnt/storage/Photography:ro
      - /mnt/storage/immich_library:/data:ro
      - sidecar-cache:/cache
    tmpfs: [/tmp]
    security_opt: ["label=disable"]
    devices: ["nvidia.com/gpu=all"]                     # CDI device from the NVIDIA container toolkit
    networks: [sidecar]
    restart: unless-stopped

volumes:
  sidecar-cache: {}
  sidecar-state: {}

networks:
  immich: { external: true, name: immich_default }
  sidecar: { internal: true }
